<html lang="en">
<head>
<meta charset="utf-8">

<meta name="author" content="Created by Touhidul Islam, Mobile : +88 01787188885, Portfolio: https://zaap.bio/TouhidDesign">
<meta name="description" content="It started on the walls. Crayons, pencils and every bare patch of paint in the house became Abdullah’s canvas. Then came the screens: for more than a year he tapped and dragged his way across both his parents’ phones, leaving trails of ink in their notes apps. At 3 years, 1 month and 13 days, he sat at his father’s desktop and made his first piece of digital art in the Concepts app, a tangle of purple, green, orange and pink that no one asked for and everyone loves. This page gives that scribble a life of its own. Touch the lines and they sing, drag a finger to draw over them, and let the whole thing dance.">
<title>Wildlines of Abdullah</title>

<style>
/* Layout rule: the paper is the whole screen. Chrome floats on it in three places, each with one job.
   Top right = what you draw with. Left rail = how much (size, opacity, undo). Bottom = playback. */
:root {
  --paper: #fbfaf7;
  --ink: #2b2945;
  --ink2: #7a7794;
  --chrome: rgba(255, 255, 255, 0.9);
  --solid: #ffffff;
  --fg: #2b2945;
  --muted: #7a7794;
  --line: rgba(43, 41, 69, 0.1);
  --hover: rgba(43, 41, 69, 0.07);
  --sel: #2b2945;
  --on-sel: #ffffff;
  --accent: #f2a01e;
  --shadow: 0 8px 28px rgba(43, 41, 69, 0.14), 0 1px 3px rgba(43, 41, 69, 0.1);
  --topH: 68px;
  --sl: clamp(72px, calc((100vh - var(--topH) - 14px - 88px - 96px) / 2), 150px);
  --font-display: "Fredoka", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
  --spring: cubic-bezier(0.3, 1.6, 0.5, 1);
}
@supports (height: 100dvh) { :root { --sl: clamp(72px, calc((100dvh - var(--topH) - 14px - 88px - 96px) / 2), 150px); } }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: rgba(34, 32, 66, 0.92); --solid: #22204a; --fg: #efedff; --muted: #a9a5cf;
    --line: rgba(255, 255, 255, 0.1); --hover: rgba(255, 255, 255, 0.09); --sel: #efedff; --on-sel: #22204a;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: rgba(34, 32, 66, 0.92); --solid: #22204a; --fg: #efedff; --muted: #a9a5cf;
  --line: rgba(255, 255, 255, 0.1); --hover: rgba(255, 255, 255, 0.09); --sel: #efedff; --on-sel: #22204a;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-weight: 600;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; z-index: 0; }
#c.noc { cursor: none; }

/* surfaces and buttons */
.surf {
  background: var(--chrome); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--fg);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
}
.ib {
  appearance: none; border: 0; background: transparent; color: var(--fg); cursor: pointer; padding: 0; flex: none;
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; touch-action: manipulation;
  transition: transform 0.28s var(--spring), background 0.15s ease, color 0.15s ease, opacity 0.2s ease;
}
.ib:hover { background: var(--hover); }
.ib.surf { background: var(--chrome); }
.ib.surf:hover { background: var(--solid); }
.ib:active { transform: scale(0.88); transition-duration: 0.08s; }
.ib:focus-visible, .mi:focus-visible, .brow:focus-visible, .chip:focus-visible, .sws:focus-visible, .seg button:focus-visible, .pill:focus-visible, .fmt:focus-visible, .title:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ib svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }
.ib[aria-pressed="true"], .ib[aria-expanded="true"] { background: var(--sel); color: var(--on-sel); }
.ib[aria-disabled="true"] { opacity: 0.28; }

/* top */
.top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 3; box-sizing: border-box; pointer-events: none;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  transition: opacity 0.25s ease;
}
.top > * { pointer-events: auto; }
.title { appearance: none; background: none; border: 0; padding: 2px 6px; margin: 0 0 0 -6px; color: var(--ink); cursor: pointer; text-align: left; display: grid; gap: 9px; border-radius: 10px; min-width: 0; }
.t1 { position: relative; font-family: var(--font-display); font-weight: 600; font-size: clamp(1.35rem, 6vw, 1.7rem); line-height: 1; letter-spacing: -0.01em; width: max-content; }
.t2 { font-family: var(--font-display); font-weight: 500; font-size: 0.82rem; line-height: 1; color: var(--ink2); }
.under { position: absolute; left: -2px; bottom: -7px; width: calc(100% + 4px); height: 9px; overflow: visible; }
.under path { fill: none; stroke: var(--accent); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.1s 0.3s ease-out backwards; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.tools { display: flex; gap: 8px; align-items: center; flex: none; }
.bar { display: flex; gap: 0; padding: 2px; border-radius: 26px; }
.round { border-radius: 50%; width: 48px; height: 48px; }
.round.ib { width: 48px; height: 48px; }
.swb { position: relative; }
.swb i { width: 26px; height: 26px; border-radius: 50%; display: block; background: var(--cur, #6a6596); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18), 0 0 0 2px var(--chrome), 0 0 0 3.5px var(--fg); }
.swb[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
.swb.rb i { background: conic-gradient(#ff5d5d, #ffb43c, #f7e24a, #4fd06a, #4aa8ff, #9a6bff, #ff5d5d); }

/* left rail */
.rail {
  position: fixed; left: 16px; top: calc(var(--topH) + env(safe-area-inset-top, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 3;
  margin: auto 0; height: max-content; width: 52px; box-sizing: border-box; padding: 8px 4px; border-radius: 28px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; transition: opacity 0.25s ease;
}
.sl { position: relative; width: 44px; height: var(--sl); touch-action: none; cursor: pointer; border-radius: 22px; outline: none; --v: 0.5; }
.sl::before { content: ""; position: absolute; left: 13px; right: 13px; top: 0; bottom: 0; border-radius: 99px; background: var(--hover); }
.sl .fill { position: absolute; left: 13px; right: 13px; bottom: 0; height: calc(var(--v) * (100% - 24px) + 12px); border-radius: 99px; background: var(--fg); opacity: 0.88; }
.sl .thumb {
  position: absolute; left: 3px; right: 3px; bottom: calc(var(--v) * (100% - 24px)); height: 24px; border-radius: 12px; box-sizing: border-box;
  background: var(--solid); border: 2px solid var(--fg); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18); transition: transform 0.2s var(--spring);
}
.sl.drag .thumb { transform: scale(1.1); }
.sl:focus-visible .thumb { outline: 3px solid var(--accent); outline-offset: 2px; }
.sl.dim { opacity: 0.32; }
.bubble { position: fixed; z-index: 4; left: 78px; min-width: 76px; height: 76px; box-sizing: border-box; padding: 6px 14px 6px 6px; border-radius: 38px; display: flex; align-items: center; gap: 8px; pointer-events: none; transform: translateY(-50%); animation: pop 0.2s var(--spring); }
@keyframes pop { from { opacity: 0; transform: translateY(-50%) scale(0.8); } to { opacity: 1; transform: translateY(-50%) scale(1); } }
.chk { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; flex: none; background: #fff; background-image: linear-gradient(45deg, #e6e5ee 25%, transparent 25%, transparent 75%, #e6e5ee 75%), linear-gradient(45deg, #e6e5ee 25%, transparent 25%, transparent 75%, #e6e5ee 75%); background-size: 12px 12px; background-position: 0 0, 6px 6px; }
.chk i { display: block; border-radius: 50%; }
.bubble b { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; min-width: 2.2ch; }

/* bottom */
.show { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 3; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 32px; transition: opacity 0.25s ease; }
.play { width: 52px; height: 52px; background: var(--accent); color: #2b2945; }
.play:hover { background: var(--accent); filter: brightness(1.05); }
.play[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); }
.play svg { width: 22px; height: 22px; }
.drawing .top, .drawing .show { opacity: 0.2; }
.drawing .rail { opacity: 0.6; }

/* popovers: one at a time, anchored under the top-right cluster, growing out of their own button */
.pop {
  position: fixed; z-index: 5; top: calc(var(--topH) + env(safe-area-inset-top, 0px) + 2px); right: 16px; box-sizing: border-box; border-radius: 22px;
  max-width: calc(100vw - 32px); max-height: calc(100vh - var(--topH) - 24px); overflow: auto; overscroll-behavior: contain;
  opacity: 0; transform: scale(0.9) translateY(-6px); transform-origin: var(--ox, 90%) 0; pointer-events: none;
  transition: transform 0.24s var(--spring), opacity 0.14s ease;
}
.pop { background: var(--solid); }
.pop.in { opacity: 1; transform: none; pointer-events: auto; }
#popBrush { width: 292px; padding: 6px; }
#popColor { width: 296px; padding: 14px; }
#popAct { width: 300px; padding: 6px; }
.brow { appearance: none; border: 0; background: transparent; width: 100%; height: 54px; padding: 0 8px 0 12px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--fg); cursor: pointer; font: 600 0.98rem var(--font-display); transition: background 0.15s ease, transform 0.2s var(--spring); }
.brow:hover { background: var(--hover); }
.brow:active { transform: scale(0.97); }
.brow[aria-checked="true"] { background: var(--hover); }
.bn { display: flex; align-items: center; gap: 10px; }
.bn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bp canvas { display: block; width: 124px; height: 38px; background: #fff; border-radius: 11px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.07); }
.sb { position: relative; height: 150px; border-radius: 14px; touch-action: none; cursor: crosshair; background: linear-gradient(to top, #000, rgba(0, 0, 0, 0)), linear-gradient(to right, #fff, hsl(var(--h, 0), 100%, 50%)); }
.sb.off, .hue.off { opacity: 0.4; }
.sb i { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box; background: var(--cur); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.35); pointer-events: none; }
.hue { position: relative; height: 44px; margin-top: 6px; touch-action: none; cursor: pointer; }
.hue::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; bottom: 8px; border-radius: 14px; background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
.hue i { position: absolute; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box; background: hsl(var(--h, 0), 100%, 50%); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.35); pointer-events: none; }
.crow { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.cur { position: relative; width: 56px; height: 40px; flex: none; }
.cur i { position: absolute; top: 0; width: 38px; height: 40px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15); }
.cur .p { left: 0; background: var(--prev, #fff); }
.cur .n { left: 18px; background: var(--cur); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15), 0 0 0 2px var(--chrome); }
#hex { flex: 1; min-width: 0; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--line); background: var(--hover); color: var(--fg); font: 700 0.92rem var(--font-body); text-transform: uppercase; padding: 0 10px; -webkit-user-select: text; user-select: text; }
#hex:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.chip { appearance: none; height: 44px; padding: 0 14px 0 12px; border-radius: 22px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 700 0.85rem var(--font-body); display: flex; align-items: center; gap: 8px; cursor: pointer; flex: none; transition: transform 0.2s var(--spring), background 0.15s ease; }
.chip:active { transform: scale(0.94); }
.chip::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(#ff5d5d, #ffb43c, #f7e24a, #4fd06a, #4aa8ff, #9a6bff, #ff5d5d); }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); border-color: transparent; }
.lbl { margin: 14px 2px 7px; font: 800 0.7rem var(--font-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.swr { display: flex; flex-wrap: wrap; gap: 6px 8px; min-height: 44px; }
.sws { appearance: none; border: 0; padding: 0; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15); transition: transform 0.2s var(--spring); }
.sws:hover { transform: scale(1.08); }
.sws:active { transform: scale(0.9); }
.sws[aria-pressed="true"] { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15), 0 0 0 2.5px var(--solid), 0 0 0 4.5px var(--fg); }
.none { font-size: 0.82rem; color: var(--muted); align-self: center; padding: 0 2px; }
.mi { appearance: none; border: 0; background: none; width: 100%; height: 50px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; gap: 12px; color: var(--fg); cursor: pointer; text-align: left; font: 700 0.98rem var(--font-body); transition: background 0.15s ease, transform 0.2s var(--spring); }
.mi:hover { background: var(--hover); }
.mi:active { transform: scale(0.97); }
.mic { width: 24px; height: 24px; display: grid; place-items: center; flex: none; }
.mic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mrow { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 6px 0 12px; font: 700 0.98rem var(--font-body); white-space: nowrap; }
.seg { margin-left: auto; display: flex; gap: 4px; }
.seg button { appearance: none; border: 0; height: 44px; min-width: 44px; padding: 0 10px; border-radius: 22px; background: var(--hover); color: var(--fg); font: 800 0.8rem var(--font-body); cursor: pointer; transition: transform 0.2s var(--spring), background 0.15s ease; }
.seg button:hover { background: var(--sel); color: var(--on-sel); }
.seg button:active { transform: scale(0.92); }
.msep { height: 1px; margin: 4px 10px; background: var(--line); }
.sw2 { margin-left: auto; width: 42px; height: 26px; border-radius: 13px; background: var(--hover); position: relative; flex: none; transition: background 0.2s ease; }
.sw2::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); transition: transform 0.25s var(--spring), background 0.2s ease; }
[aria-checked="true"] > .sw2 { background: var(--accent); }
[aria-checked="true"] > .sw2::after { transform: translateX(16px); background: #fff; }
.cap { margin: 8px 12px 8px; font-size: 0.76rem; font-weight: 700; color: var(--muted); line-height: 1.4; }

/* toast, empty page */
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 6; transform: translate(-50%, 8px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px); background: var(--sel); color: var(--on-sel); font: 500 0.95rem var(--font-display); padding: 8px 18px; border-radius: 999px; white-space: nowrap; transition: opacity 0.2s ease, transform 0.3s var(--spring); }
.toast:has(button) { padding-right: 8px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast button { pointer-events: auto; appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; color: #2b2945; background: var(--accent); border-radius: 999px; padding: 4px 14px; min-height: 32px; }
#empty { position: fixed; inset: 0; z-index: 1; display: grid; place-content: center; text-align: center; pointer-events: none; padding: 0 24px 40px; }
#empty b { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.6rem, 7vw, 2.2rem); color: var(--ink); opacity: 0.75; }
#empty span { color: var(--ink2); font-weight: 700; margin-top: 4px; }

/* save preview */
.sheet { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(20, 18, 40, 0.5); padding: 16px; }
.card { background: var(--solid); color: var(--fg); border-radius: 26px; padding: 14px; box-shadow: var(--shadow); transform: rotate(-1deg); animation: card 0.4s var(--spring); display: grid; gap: 12px; justify-items: center; max-width: 100%; box-sizing: border-box; }
@keyframes card { from { opacity: 0; transform: rotate(-4deg) scale(0.85); } to { opacity: 1; transform: rotate(-1deg) scale(1); } }
.pic { position: relative; background: #fff; border-radius: 16px; overflow: hidden; display: grid; place-items: center; width: min(80vw, 520px); min-height: 150px; }
.pic img { display: block; max-width: 100%; max-height: min(56vh, 520px); width: auto; height: auto; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
.busy { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; background: #fff; color: #7a7794; font-family: var(--font-display); font-weight: 500; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #e3e1ee; border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.pill { appearance: none; border: 0; cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 1rem; color: var(--fg); background: var(--hover); border-radius: 999px; padding: 0 24px; min-height: 44px; transition: transform 0.25s var(--spring); }
.pill.primary { background: var(--accent); color: #2b2945; }
.pill:disabled { opacity: 0.5; }
.pill:active { transform: scale(0.94); }
.tip { margin: 0; font-size: 0.78rem; font-weight: 700; color: var(--muted); text-align: center; }

@media (max-width: 350px) { .t2 { display: none; } }
@media (max-width: 420px) { .tools { gap: 6px; } .toast { white-space: normal; text-align: center; width: max-content; max-width: calc(100vw - 112px); left: calc(50% + 28px); } }
@media (max-height: 460px) { #empty { padding-bottom: 80px; } .brow { height: 46px; } .bp canvas { height: 34px; } }
@media (prefers-reduced-motion: reduce) {
  .under path, .pop, .card, .bubble { animation: none; }
  .ib, .pop, .toast, .sl .thumb, .brow, .mi, .chip, .sws, .seg button, .pill, .sw2, .sw2::after { transition: none; }
}
html, body { margin: 0; }
:root { color-scheme: light; }
</style>

<canvas id="c" aria-label="Drawing paper with Abdullah's scribble. Touch the lines for sparkles and sounds. Drag to draw."></canvas>
<div id="empty" hidden><b>A fresh page</b><span>Draw anything</span></div>

<header class="top" id="top">
  <button class="title" id="party" aria-label="Wildlines of Abdullah. Tap for a dance party.">
    <span class="t1">Wildlines<svg class="under" viewBox="0 0 200 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M3 6 C 28 1, 48 10, 78 5 S 128 2, 158 6 S 188 7, 197 3"/></svg></span>
    <span class="t2">of Abdullah</span>
  </button>
  <div class="tools" id="tools">
    <div class="bar surf" role="toolbar" aria-label="Drawing tools">
      <button class="ib" id="bBrush" aria-label="Brush" title="Brush  (B)" aria-pressed="true" aria-haspopup="dialog" aria-expanded="false"></button>
      <button class="ib" id="bEraser" aria-label="Eraser" title="Eraser  (E)" aria-pressed="false" data-ic="eraser"></button>
      <button class="ib swb" id="bColor" aria-label="Color" title="Color" aria-haspopup="dialog" aria-expanded="false"><i></i></button>
    </div>
    <button class="ib round surf" id="bAct" aria-label="Menu" title="Menu" aria-haspopup="menu" aria-expanded="false" data-ic="more"></button>
  </div>
</header>

<aside class="rail surf" id="rail" aria-label="Brush size, undo, redo and opacity">
  <div class="sl" id="sSize" role="slider" tabindex="0" aria-orientation="vertical" aria-label="Size" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><div class="fill"></div><div class="thumb"></div></div>
