<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Created by Touhidul Islam, Mobile : +88 01787188885, Portfolio: https://zaap.bio/TouhidDesign">
<meta name="description" content="It started on the walls. Crayons, pencils and every bare patch of paint in the house became Abdullah’s canvas. Then came the screens: for more than a year he tapped and dragged his way across both his parents’ phones, leaving trails of ink in their notes apps. At 3 years, 1 month and 13 days, he sat at his father’s desktop and made his first piece of digital art in the Concepts app, a tangle of purple, green, orange and pink that no one asked for and everyone loves. This page gives that scribble a life of its own. Touch the lines and they sing, drag a finger to draw over them, and let the whole thing dance.">

<title>Wildlines of Abdullah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
html, body { margin: 0; }
:root { color-scheme: light; }

/* Layout: one tall stage holding the living scribble, a small header above it, big round buttons below. */
:root {
  --bg: #efeef3;
  --paper: #fbfbfa;
  --fg: #2c2a45;
  --muted: #6c698a;
  --line: #d8d6e6;
  --btn: #ffffff;
  --purple: #6a6596;
  --green: #4fbf68;
  --orange: #f2a01e;
  --pink: #c23a78;
  --font-display: "Fredoka", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100e1f;
    --paper: #1a1830;
    --fg: #efedff;
    --muted: #a19dc7;
    --line: #34305a;
    --btn: #25224a;
    --purple: #aaa5e6;
    --green: #6fe08a;
    --orange: #ffb43c;
    --pink: #ff77ac;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100e1f;
  --paper: #1a1830;
  --fg: #efedff;
  --muted: #a19dc7;
  --line: #34305a;
  --btn: #25224a;
  --purple: #aaa5e6;
  --green: #6fe08a;
  --orange: #ffb43c;
  --pink: #ff77ac;
  color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; }
body {
  box-sizing: border-box;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-inline: 16px;
  padding-block: 14px;
  overflow-x: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.titles { min-width: 0; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(1.3rem, 6vw, 1.7rem); line-height: 1.1; text-wrap: balance; }
#hint { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; font-weight: 500; transition: opacity 0.8s ease; }
#hint.gone { opacity: 0; }
.age {
  font-family: var(--font-display); font-weight: 500; font-size: 0.8rem; letter-spacing: 0.02em;
  color: var(--muted); border: 2px solid var(--line); border-radius: 16px; padding: 4px 12px; max-width: 100%; line-height: 1.3;
}
#stage {
  position: relative; flex: 1; min-height: 240px; min-width: 0;
  background: var(--paper); border: 2px solid var(--line); border-radius: 22px; overflow: hidden;
}
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 22px; }
.row { display: flex; flex-wrap: nowrap; gap: clamp(6px, 2vw, 10px); justify-content: center; }
.btn {
  appearance: none; border: 2px solid var(--line); background: var(--btn); color: var(--fg);
  width: clamp(44px, 14vw, 56px); height: clamp(44px, 14vw, 56px); flex: none; touch-action: manipulation; border-radius: 50%; padding: 0; display: grid; place-items: center; cursor: pointer;
  transition: transform 0.12s ease;
}
.btn:active { transform: scale(0.92); }
.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.btn svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.dot { border: 0; }
.dot[aria-pressed="true"] { outline: 3px solid var(--fg); outline-offset: 3px; }
.dot.purple { background: var(--purple); }
.dot.green { background: var(--green); }
.dot.orange { background: var(--orange); }
.dot.pink { background: var(--pink); }
.dot.rainbow { background: conic-gradient(#ff5d5d, #ffb43c, #f7e24a, #4fd06a, #4aa8ff, #9a6bff, #ff5d5d); }
#sound .off { display: none; }
#sound[aria-pressed="false"] .on { display: none; }
#sound[aria-pressed="false"] .off { display: block; }
@media (max-height: 520px) {
  body { gap: 8px; padding-block: 8px; }
  #hint, .age { display: none; }
  h1 { font-size: 1.2rem; }
  #stage { min-height: 140px; }
  .btn { width: 44px; height: 44px; }
  .btn svg { width: 24px; height: 24px; }
  .bar { flex-wrap: nowrap; gap: 14px; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } #hint { transition: none; } }
</style>

<body>

<header>
  <div class="titles">
    <h1>Wildlines of Abdullah</h1>
    <p id="hint">Touch the lines. Draw with a finger. Drawings stay saved on this device.</p>
  </div>
  <span class="age">Drawn at the age of 3 years, 1 month, &amp; 13 days</span>
</header>

<div id="stage"><canvas id="c" aria-label="An interactive scribble: touch it to make sparkles and sounds, drag to draw"></canvas></div>

<div class="bar">
  <div class="row" id="colors" role="group" aria-label="Crayon colors">
    <button class="btn dot purple" data-i="0" aria-label="Purple crayon" aria-pressed="true"></button>
    <button class="btn dot green" data-i="1" aria-label="Green crayon" aria-pressed="false"></button>
    <button class="btn dot orange" data-i="2" aria-label="Orange crayon" aria-pressed="false"></button>
    <button class="btn dot pink" data-i="3" aria-label="Pink crayon" aria-pressed="false"></button>
    <button class="btn dot rainbow" data-i="4" aria-label="Rainbow crayon" aria-pressed="false"></button>
  </div>
  <div class="row">
    <button class="btn" id="replay" aria-label="Draw it again" title="Draw it again">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
    </button>
    <button class="btn" id="party" aria-label="Dance party" title="Dance party">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.3 5.8.5-4.4 3.8 1.4 5.6L12 15.2 7 18.2l1.4-5.6L4 8.8l5.8-.5z"/></svg>
    </button>
    <button class="btn" id="clear" aria-label="New page for my drawing" title="New page (keeps the first scribble)">
      <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6"/></svg>
    </button>
    <button class="btn" id="sound" aria-label="Sound" aria-pressed="true" title="Sound on or off">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </div>
</div>

<script>
(function () {
  var cvs = document.getElementById('c');
  var ctx = cvs.getContext('2d');
  var stage = document.getElementById('stage');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- theme colors (read from CSS tokens) ----------
  var C = {};
  function hex(h) {
    h = h.trim().replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    ['purple', 'green', 'orange', 'pink'].forEach(function (k) {
      var v = cs.getPropertyValue('--' + k);
      C[k] = v ? hex(v) : [120, 120, 160];
    });
  }
  readColors();
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); } catch (e) {}
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  // ---------- canvas sizing and world transform ----------
  // World units are pixels of the original drawing; the artwork spans x 290-1200, y 120-640.
  var W = 0, H = 0, dpr = 1, S = 1, TX = 0, TY = 0;
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(100, r.width - 4); H = Math.max(100, r.height - 4);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    S = Math.min((W - 16) / 910, (H - 16) / 520, 1.7);
    TX = (W - 910 * S) / 2 - 290 * S;
    TY = (H - 520 * S) / 2 - 120 * S;
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  // ---------- building the scribble ----------
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var R = rng(2026);

  function spline(ctrl, per) {
    per = per || 8;
    var out = [], n = ctrl.length;
    for (var i = 0; i < n - 1; i++) {
      var p0 = ctrl[Math.max(0, i - 1)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(n - 1, i + 2)];
      for (var k = 0; k < per; k++) {
        var t = k / per, t2 = t * t, t3 = t2 * t;
        out.push(
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
        );
      }
    }
    out.push(ctrl[n - 1][0], ctrl[n - 1][1]);
    return out;
  }

  function loop(cx, cy, hx, hy, rot, n, turns, wob) {
    var pts = [], N = 120, cr = Math.cos(rot), sr = Math.sin(rot), ph = R() * 6.28;
    for (var k = 0; k <= N * turns; k++) {
      var a = (k / N) * Math.PI * 2 + ph;
      var c = Math.cos(a), s = Math.sin(a);
      var grow = 1 + wob * Math.sin(k * 0.07 + ph);
      var x = hx * grow * (c < 0 ? -1 : 1) * Math.pow(Math.abs(c), 2 / n);
      var y = hy * grow * (s < 0 ? -1 : 1) * Math.pow(Math.abs(s), 2 / n);
      pts.push(cx + x * cr - y * sr, cy + x * sr + y * cr);
    }
    return pts;
  }

  function rrect(x0, y0, x1, y1, r) {
    var c = [
      [x0 + r, y0], [x1 - r, y0], [x1, y0 + r], [x1, y1 - r], [x1 - r, y1], [x0 + r, y1], [x0, y1 - r], [x0, y0 + r], [x0 + r, y0], [x0 + 60, y0]
    ];
    var pts = [];
    for (var i = 0; i < c.length - 1; i++) {
      var a = c[i], b = c[i + 1];
      var steps = Math.max(2, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 14));
      for (var k = 0; k < steps; k++) {
        var t = k / steps;
        pts.push(a[0] + (b[0] - a[0]) * t + Math.sin(i * 2 + k) * 0.8, a[1] + (b[1] - a[1]) * t + Math.cos(i * 3 + k) * 0.8);
      }
    }
    return pts;
  }

  var strokes = [];
  var PENTA = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880, 987.77, 1046.5];
  function add(o) {
    o.phase = R() * 6.28; o.hue = R() * 360; o.pT = 0; o.pK = 0; o.pg = o.pg || 0.4;
    strokes.push(o); return o;
  }

  // lavender sweeping arcs
  [
    [[310, 415], [322, 330], [380, 250], [480, 200], [600, 165], [760, 145], [900, 135], [1010, 135]],
    [[380, 620], [440, 500], [520, 380], [640, 280], [760, 200], [840, 148]],
    [[600, 610], [640, 480], [700, 330], [800, 230], [900, 165], [985, 135]],
    [[900, 600], [920, 450], [960, 300], [1010, 200], [1050, 140], [1110, 135]],
    [[1180, 565], [1100, 603], [950, 612], [800, 602]],
    [[1187, 410], [1155, 300], [1135, 205], [1105, 150]]
  ].forEach(function (c, i) {
    add({ g: 'arc', col: 'purple', pts: spline(c), w: 8, a: 0.26, t0: 0.8 + i * 0.25, dur: 1.2, note: 329.63 });
  });

  // orange loops
  for (var i = 0; i < 115; i++) {
    var round = R() < 0.6, rot = R() < 0.5 ? (R() - 0.5) * 0.9 : (R() - 0.5) * 0.12;
    var f = rot > 0.15 || rot < -0.15 ? 0.84 : 1;
    var hx = 365 * f * (0.3 + 0.7 * Math.pow(R(), 0.6)), hy = 205 * f * (0.3 + 0.7 * Math.pow(R(), 0.6));
    var cx = 783 + (R() - 0.5) * 2 * (365 - hx) * 0.9, cy = 417 + (R() - 0.5) * 2 * (205 - hy) * 0.9;
    add({ g: 'orange', col: 'orange', pts: loop(cx, cy, hx, hy, rot, round ? 3.2 : 2, 1 + R() * 0.12, 0.012), w: 1, a: 0.78, pg: 3.6, t0: 1.6 + i * 0.035, dur: 1.0, note: PENTA[7 + Math.floor(R() * 4)] });
  }

  // pink loops
  for (var j = 0; j < 14; j++) {
    add({ g: 'pink', col: 'pink', pts: loop(860 + (R() - 0.5) * 160, 330 + (R() - 0.5) * 100, 15 + R() * 110, 12 + R() * 60, R() * 3.14, 2, 1 + R() * 0.2, 0.02), w: 0.9, a: 0.85, pg: 3, t0: 4.3 + j * 0.06, dur: 0.8, note: PENTA[10 + (j % 2)] });
  }
  add({ g: 'pink', col: 'pink', pts: spline([[600, 321], [760, 319], [940, 317], [1090, 316]]), w: 0.9, a: 0.85, pg: 3, t0: 4.8, dur: 0.6, note: 1046.5 });

  // frame
  add({ g: 'frame', col: 'purple', pts: rrect(303, 131, 1187, 628, 9), w: 6, a: 0.85, t0: 0, dur: 1.4, note: 196, pg: 0.6 });

  // dark purple strokes
  [
    [[303, 580], [400, 560], [520, 545], [610, 528], [655, 510]],
    [[530, 180], [485, 235], [500, 285], [560, 330], [620, 390], [660, 430], [680, 452], [793, 455]],
    [[590, 262], [640, 258], [668, 290], [655, 330]],
    [[433, 520], [450, 470], [520, 420], [600, 380]],
    [[655, 510], [700, 508], [740, 525], [770, 545], [800, 580], [830, 590], [900, 570], [950, 545]],
    [[640, 450], [665, 410], [710, 402], [760, 420], [790, 470], [805, 520], [815, 560]],
    [[1187, 495], [1100, 540], [1000, 590], [920, 600]],
    [[1050, 135], [1000, 170], [970, 230], [950, 300], [925, 360]],
    [[355, 628], [420, 590], [445, 545]],
    [[855, 135], [800, 190], [775, 250], [770, 330], [770, 420], [780, 500], [810, 565]]
  ].forEach(function (c, i) {
    add({ g: 'dark', col: 'purple', pts: spline(c), w: 6, a: 0.9, t0: 1.5 + i * 0.18, dur: 0.9, note: 392, pg: 0.6 });
  });
  add({ g: 'dark', col: 'purple', pts: loop(577, 468, 22, 20, 0, 2, 1.3, 0.02), w: 5, a: 0.9, t0: 2.2, dur: 0.6, note: 392, pg: 0.6 });

  // green strokes
  add({ g: 'green', col: 'green', pts: spline([[350, 135], [420, 200], [500, 270], [560, 330], [600, 360]]), w: 9, a: 0.24, t0: 2.3, dur: 1.0, note: 523.25, pg: 0.4 });
  [
    [[303, 200], [330, 225], [345, 255], [350, 280], [370, 262], [390, 270], [375, 300], [395, 350], [425, 362], [480, 360], [497, 340]],
    [[400, 350], [410, 400], [440, 450], [490, 510], [550, 550], [620, 562], [690, 555], [735, 525], [740, 500], [700, 455], [650, 400]],
    [[580, 430], [590, 380], [600, 345], [640, 345], [690, 342], [735, 360], [780, 410], [820, 455], [858, 480], [800, 490], [720, 492], [660, 492]],
    [[555, 468], [560, 510], [600, 505], [630, 520], [660, 500], [610, 480], [560, 478]],
    [[610, 395], [640, 385], [670, 360], [678, 350]]
  ].forEach(function (c, i) {
    add({ g: 'green', col: 'green', pts: spline(c), w: 6, a: 0.92, t0: 2.4 + i * 0.3, dur: 1.0, note: 523.25, pg: 0.6 });
  });

  // ---------- state ----------
  var replayAt = -1e9;
  var party = reduce ? 0 : 0.45;
  var ripples = [];
  var sparks = [];
  var colorIdx = 0;
  var active = new Map();
  var last = performance.now();
  var timers = [];

  // ---------- saving his drawings on this device ----------
  var KEY = 'first-scribble-v1';
  function saveUser() {
    try {
      var data = strokes.filter(function (s) { return s.user && s.pts.length >= 4; }).map(function (s) {
        return { w: Math.round(s.w * 100) / 100, col: s.col, rb: s.rainbow ? 1 : 0, hue: Math.round(s.hue), pts: s.pts.map(function (v) { return Math.round(v * 10) / 10; }) };
      });
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {}
  }
  function loadUser() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      JSON.parse(raw).forEach(function (d) {
        if (!d || !d.pts || d.pts.length < 4) return;
        strokes.push({ user: true, g: 'user', pts: d.pts, w: d.w, a: 0.95, col: d.col, rainbow: !!d.rb, phase: Math.random() * 6.28, hue: d.hue || 0, pT: 0, pK: 0, pg: 0.3, t0: 0, dur: 0 });
      });
    } catch (e) {}
  }
  loadUser();

  // ---------- audio ----------
  var ac = null, soundOn = true;
  function initAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') { ac.resume().catch(function () {}); }
  }
  function tone(f, type, dur, vol, delay) {
    if (!ac || !soundOn) return;
    var t0 = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.7));
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + (dur || 0.7) + 0.05);
  }
  function voice(group, f) {
    if (group === 'frame') { tone(f, 'triangle', 1.2, 0.2); tone(f * 2, 'sine', 0.8, 0.05); }
    else if (group === 'arc') { tone(f, 'sine', 1.0, 0.14); }
    else if (group === 'dark') { tone(f, 'triangle', 0.8, 0.14); }
    else if (group === 'green') { tone(f, 'sine', 0.7, 0.15); tone(f * 2, 'sine', 0.3, 0.05); }
    else if (group === 'orange') { tone(f, 'sine', 0.6, 0.1); tone(f * 1.5, 'sine', 0.4, 0.04, 0.05); }
    else if (group === 'pink') { tone(f, 'sine', 0.9, 0.1); tone(f * 2.76, 'sine', 0.35, 0.04); }
    else { tone(f, 'sine', 0.6, 0.12); }
  }

  // ---------- sparkles ----------
  var SP = ['purple', 'green', 'orange', 'pink'];
  function spawn(x, y, n, speed) {
    for (var i = 0; i < n && sparks.length < 420; i++) {
      var a = Math.random() * 6.283, v = (0.35 + Math.random()) * (speed || 220);
      sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0, max: 0.7 + Math.random() * 0.7, size: 3 + Math.random() * 6, col: SP[(Math.random() * 4) | 0], star: Math.random() < 0.5 });
    }
  }
  function confetti(n) {
    for (var i = 0; i < n && sparks.length < 420; i++) {
      sparks.push({ x: Math.random() * W, y: -10 - Math.random() * 60, vx: (Math.random() - 0.5) * 120, vy: 60 + Math.random() * 160, life: 0, max: 1.6 + Math.random() * 1.4, size: 4 + Math.random() * 7, col: SP[(Math.random() * 4) | 0], star: Math.random() < 0.5 });
    }
  }
  function drawStar(x, y, r) {
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4, rr = i % 2 ? r * 0.35 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  }

  // ---------- touch interactions ----------
  function worldOf(px, py) { return [(px - TX) / S, (py - TY) / S]; }

  function tapAt(px, py) {
    var w = worldOf(px, py), t = performance.now() / 1000;
    var best = null, bd = 1e9;
    for (var si = 0; si < strokes.length; si++) {
      var s = strokes[si], p = s.pts, dm = 1e9;
      for (var i = 0; i < p.length; i += 4) {
        var dx = p[i] - w[0], dy = p[i + 1] - w[1], d = dx * dx + dy * dy;
        if (d < dm) dm = d;
      }
      dm = Math.sqrt(dm); s.dmin = dm;
      if (dm < bd) { bd = dm; best = s; }
    }
    for (var k = 0; k < strokes.length; k++) {
      var q = strokes[k];
      q.pT = t + q.dmin / 450; q.pK = Math.exp(-q.dmin / 320);
    }
    if (best && bd * S < 44) {
      best.pT = t; best.pK = 1;
      voice(best.g, best.note || PENTA[(Math.random() * PENTA.length) | 0]);
    } else {
      tone(PENTA[Math.min(PENTA.length - 1, Math.floor(px / W * PENTA.length))], 'sine', 0.6, 0.12);
    }
    ripples.push({ x: w[0], y: w[1], t0: t });
    if (ripples.length > 8) ripples.shift();
    spawn(px, py, 18, 240);
  }

  function pos(e) {
    var r = cvs.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function hideHint() { document.getElementById('hint').classList.add('gone'); }

  cvs.addEventListener('pointerdown', function (e) {
    e.preventDefault(); initAudio(); hideHint();
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
    var p = pos(e), w = worldOf(p[0], p[1]);
    var s = { user: true, g: 'user', pts: [w[0], w[1]], w: 12 / S, a: 0.95, col: ['purple', 'green', 'orange', 'pink'][colorIdx] || 'purple', rainbow: colorIdx === 4, phase: Math.random() * 6.28, hue: Math.random() * 360, pT: 0, pK: 0, pg: 0.3, t0: 0, dur: 0 };
    strokes.push(s);
    active.set(e.pointerId, { s: s, len: 0, t: performance.now(), last: p, acc: 0, lastTone: 0 });
  });
  cvs.addEventListener('pointermove', function (e) {
    var a = active.get(e.pointerId);
    if (!a) return;
    e.preventDefault();
    var p = pos(e), d = Math.hypot(p[0] - a.last[0], p[1] - a.last[1]);
    if (d < 3) return;
    var w = worldOf(p[0], p[1]);
    a.s.pts.push(w[0], w[1]);
    a.len += d; a.acc += d; a.last = p;
    if (a.acc > 28) { a.acc = 0; spawn(p[0], p[1], 1, 90); }
    var now = performance.now();
    if (a.len > 12 && now - a.lastTone > 110) {
      a.lastTone = now;
      var idx = Math.max(0, Math.min(PENTA.length - 1, Math.floor((1 - p[1] / H) * PENTA.length)));
      tone(PENTA[idx], 'sine', 0.35, 0.07);
    }
  });
  function endStroke(e) {
    var a = active.get(e.pointerId);
    if (!a) return;
    active.delete(e.pointerId);
    if (a.len < 10 && performance.now() - a.t < 450) {
      var i = strokes.indexOf(a.s);
      if (i >= 0) strokes.splice(i, 1);
      tapAt(a.last[0], a.last[1]);
    } else {
      saveUser();
    }
  }
  cvs.addEventListener('pointerup', endStroke);
  cvs.addEventListener('pointercancel', endStroke);
  cvs.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- buttons ----------
  var colorBtns = document.querySelectorAll('#colors .dot');
  colorBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      initAudio(); hideHint();
      colorIdx = +b.dataset.i;
      colorBtns.forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      tone(PENTA[3 + colorIdx], 'sine', 0.4, 0.1);
    });
  });
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  document.getElementById('replay').addEventListener('click', function () {
    initAudio(); hideHint(); clearTimers();
    replayAt = performance.now() / 1000;
    ripples = [];
    if (reduce) replayAt = -1e9;
    [[0, 'frame', 196], [0.8, 'arc', 329.63], [1.5, 'dark', 392], [2.4, 'green', 523.25], [3.0, 'orange', 659.25], [3.3, 'orange', 783.99], [3.6, 'orange', 987.77], [4.3, 'pink', 1046.5], [4.6, 'pink', 1318.5]].forEach(function (n) {
      timers.push(setTimeout(function () { voice(n[1], n[2]); }, n[0] * 1000));
    });
  });
  document.getElementById('party').addEventListener('click', function () {
    initAudio(); hideHint();
    party = 1; confetti(70);
    var notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1318.5];
    notes.forEach(function (f, i) { tone(f, 'triangle', 0.5, 0.13, i * 0.11); });
    var w = worldOf(W / 2, H / 2), t = performance.now() / 1000;
    ripples.push({ x: w[0], y: w[1], t0: t });
  });
  document.getElementById('clear').addEventListener('click', function () {
    initAudio();
    strokes = strokes.filter(function (s) { return !s.user; });
    active.clear();
    saveUser();
    tone(392, 'sine', 0.3, 0.1); tone(261.63, 'sine', 0.4, 0.1, 0.1);
  });
  var soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', function () {
    initAudio();
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if (soundOn) tone(523.25, 'sine', 0.4, 0.12);
  });

  // gentle wave when the page opens
  ripples.push({ x: 745, y: 380, t0: performance.now() / 1000 + 0.2 });

  // ---------- render loop ----------
  function frame(nowMs) {
    var dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
    var t = nowMs / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (party > 0) party = Math.max(0, party - dt / 2.6);
    var idle = reduce ? 0 : 0.9 + party * 6;
    ripples = ripples.filter(function (r) { return t - r.t0 < 3.2; });
    var rt = t - replayAt;

    for (var si = 0; si < strokes.length; si++) {
      var s = strokes[si], p = s.pts, n = p.length >> 1;
      if (n < 2) continue;
      var frac = 1;
      if (!s.user && rt < 8) frac = Math.max(0, Math.min(1, (rt - s.t0) / s.dur));
      if (frac <= 0) continue;
      var cnt = Math.max(2, Math.floor(frac * n));
      var pulse = (s.pT && t >= s.pT) ? Math.exp(-(t - s.pT) * 3.2) * s.pK : 0;
      var lw = Math.max(0.75, s.w * (1 + pulse * s.pg) * S);
      var alpha = Math.min(1, s.a + pulse * 0.5);
      var base = C[s.col] || C.purple;
      var partyOn = party > 0.04 && !s.rainbow;
      var ph = s.phase;
      var xs = new Array(cnt), ys = new Array(cnt);

      for (var i = 0; i < cnt; i++) {
        var x = p[2 * i], y = p[2 * i + 1];
        var ox = idle * Math.sin(t * 1.4 + ph + y * 0.015), oy = idle * Math.cos(t * 1.2 + ph * 1.3 + x * 0.015);
        for (var ri = 0; ri < ripples.length; ri++) {
          var r = ripples[ri], age = t - r.t0;
          if (age < 0) continue;
          var dx = x - r.x, dy = y - r.y, d = Math.sqrt(dx * dx + dy * dy) + 0.001;
          var front = age * 340, e = Math.exp(-((d - front) * (d - front)) / (2 * 110 * 110));
          var amp = (reduce ? 3 : 15) * e * Math.sin((d - front) / 24) * Math.exp(-age * 0.8);
          ox += dx / d * amp; oy += dy / d * amp;
        }
        xs[i] = (x + ox) * S + TX; ys[i] = (y + oy) * S + TY;
      }

      if (s.rainbow) {
        var step = 4;
        for (var a0 = 0; a0 < cnt - 1; a0 += step) {
          ctx.beginPath(); ctx.moveTo(xs[a0], ys[a0]);
          var a1 = Math.min(cnt - 1, a0 + step);
          for (var q = a0 + 1; q <= a1; q++) ctx.lineTo(xs[q], ys[q]);
          ctx.strokeStyle = 'hsla(' + ((s.hue + a0 * 6 + t * 60) % 360) + ',85%,58%,' + alpha + ')';
          ctx.lineWidth = lw; ctx.stroke();
        }
      } else {
        ctx.beginPath(); ctx.moveTo(xs[0], ys[0]);
        for (var k = 1; k < cnt; k++) ctx.lineTo(xs[k], ys[k]);
        ctx.strokeStyle = partyOn ? 'hsla(' + ((s.hue + t * 140) % 360) + ',85%,60%,' + Math.min(1, alpha + 0.1) + ')' : rgba(base, alpha);
        ctx.lineWidth = lw; ctx.stroke();
      }
    }

    // sparkles
    for (var i2 = sparks.length - 1; i2 >= 0; i2--) {
      var sp = sparks[i2];
      sp.life += dt;
      if (sp.life >= sp.max) { sparks.splice(i2, 1); continue; }
      sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.vy += 380 * dt; sp.vx *= 0.99;
      var k2 = 1 - sp.life / sp.max;
      ctx.fillStyle = rgba(C[sp.col] || C.pink, Math.min(1, k2 * 1.4));
      if (sp.star) drawStar(sp.x, sp.y, sp.size * (0.5 + k2 * 0.7));
      else { ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.size * 0.5 * (0.5 + k2), 0, 6.283); ctx.fill(); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
